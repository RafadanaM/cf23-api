services:
  app:
    image: rafadanam/cf23-api:${IMAGE_TAG}
    container_name: cf23-api
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${APP_PORT}/healthcheck']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      - '5600:${APP_PORT}'
    volumes:
      - db_data:/usr/app/db_data
      - live_data:/usr/app/live_data

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.17
    container_name: imgproxy
    ports:
      - '8080:8080'
    environment:
      IMGPROXY_KEY: '${IMGPROXY_KEY}'
      IMGPROXY_SALT: '${IMGPROXY_SALT}'

      AWS_ACCESS_KEY_ID: '${IMGPROXY_S3_ACCESS_KEY_ID}'
      AWS_SECRET_ACCESS_KEY: '${IMGPROXY_S3_SECRET_ACCESS_KEY}'
      IMGPROXY_S3_ENDPOINT: '${S3_API_ENDPOINT}'
      IMGPROXY_S3_ALLOWED_BUCKETS: '${S3_BUCKET_NAME}'
      IMGPROXY_USE_S3: 'true'
      AWS_REGION: 'auto'
    restart: always

volumes:
  db_data:
  live_data:
